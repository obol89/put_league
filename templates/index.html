<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>PUT tournament</title>
    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/jquery.fullpage.css">
    <script src="https://code.jquery.com/jquery-3.5.0.js"></script>
    <script src="static/js/jquery.fullpage.js"></script>
  </head>
  <body>
      <div id="fullpage">
          <div class="section s1" data-anchor="site1">
            <h1><b>Welcome to
            <br>PUT LEAGUE</b></h1>
            <h2>The best place to create a tournament</h2>
              <div id="button1">
                <a href="#site2" class="button4">Start</a>
              </div>
            </div>
          <div class="section" data-anchor="site2">
              <div class="slide s2">
                <h2>Select sports discipline:
                  <select id="sport_disciplines">
                    <option value="football">Football</option>
                    <option value="volleyball">Volleyball</option>
                    <option value="handball">Handball</option>
                    <option value="basketball">Basketball</option>
                    <option value="ice-hockey">Ice hockey</option>
                  </select>
                </h2>
                <h2>Number of teams:
                  <input type="number" id="teams_number" min="4" max="64" step="2" value="16">
                </h2>
                <h2>Number of groups:
                  <select id="group_count">
                  </select>
                </h2>
                  <div id="button1">
                    <a href="#site2/site3" class="button4" id="toTeamEntry">Next</a>
                  </div>
              </div>
              <div class="slide s3" data-anchor="site3">
                <h2>Enter team names:
                    <form onsubmit="event.preventDefault();onFormSubmit();" autocomplete="off">
                    <label id="teamNameError"></label>
                      <div class="team-add-button">
                        <input class="input1" type="text" name="teamName" id="teamName" maxlength="32" title="Up to 32 characters">
                        <input type="submit" class="button4" value="Add team">
                      </div>
                    </form>
                </h2>
                  <table class="table1" id="allTeams">
                    <thead>
                    <tr>
                      <th>No.</th>
                      <th>Team name</th>
                      <th></th>
                    </tr>
                  </thead>
                    <tbody>

                    </tbody>
                  </table>
                  <div id="button5">
                    <a href="#site2" class="button4 button4-center" id="toSite2">Back</a>
                    <a href="teams" class="button4 button4-center" id="Split">Split into groups</a>
                  </div>
              </div>
              <div class="slide s4" data-anchor="site4">
                <h1>Generated groups</h1>
                <div>
                    <button id="generate">Generate</button>
                      <form id='teams_groups'>

                      </form>
                </div>
                  <div id="button1">
                    <a href="/"><button>Home</button></a>
                  </div>
              </div>
            </div>
      <script>
        new fullpage("#fullpage", {
            autoScrolling:true,
            controlArrows:false,
        });
      </script>
      <script>
        // Populate group count dropdown based on team count
        function updateGroupOptions() {
          let teamCount = parseInt($('#teams_number').val());
          let select = $('#group_count');
          select.empty();

          if (isNaN(teamCount) || teamCount < 4) return;

          // Find valid divisors where group size >= 2
          for (let g = 2; g <= teamCount / 2; g++) {
            if (teamCount % g === 0) {
              let groupSize = teamCount / g;
              if (groupSize >= 2) {
                select.append($('<option>', {
                  value: g,
                  text: g + ' groups of ' + groupSize
                }));
              }
            }
          }

          // Default to 4 groups if available, otherwise first option
          if (select.find('option[value="4"]').length) {
            select.val('4');
          }
        }

        $('#teams_number').on('change input', updateGroupOptions);
        updateGroupOptions();
      </script>

      <script src="static/js/table.js"></script>
  </body>
</html>
