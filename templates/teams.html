<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/css/tables.css">
    <title>Generated groups</title>
  </head>
  <body>
    <div class="container" id="blur">
      <div class="content">
        <div class='teamsPage'>
          <h1>Your groups:</h1>
          <table class='fullTab'>
            {% for group in groups %}
              {% if loop.index0 % 2 == 0 %}<tr>{% endif %}
              <td>
                <table class='flex{{ loop.index }}'>
                  <thead>
                    <tr>
                      <th>Group {{ group_letter(loop.index0) }}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {% for team in group %}
                    <tr>
                      <td>{{ team }}</td>
                    </tr>
                    {% endfor %}
                  </tbody>
                </table>
              </td>
              {% if loop.index % 2 == 0 or loop.last %}</tr>{% endif %}
            {% endfor %}
          </table>
        </div>
        <a href="/" class="button4 button4-center" id="goHome">Home</a>
        <a href="#" onclick="toggle();" id="newPopup"><button class="button4" id="buttonPop">Next</button></a>
      </div>
    </div>
    <div id="popup">
      <p><a href="/summary" target="_blank" id="buttonsPop"><button class="button4" id="popFile">Get CSV</button></a></p>
      <p><a href="/" id="buttonsPop"><button class="button4" id="popHome">Home</button></a></p>
      <a href="#" onclick="toggle();"><button>Close</button></a>
    </div>
    <script type="text/javascript">
      function toggle(){
        let blur = document.getElementById("blur");
        blur.classList.toggle("active")
        let popup = document.getElementById("popup");
        popup.classList.toggle("active")
      }
   </script>
  </body>
</html>
